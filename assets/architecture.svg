<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Governance architecture: the model proposes, deterministic layers dispose</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker>
  </defs>
  <rect width="960" height="560" rx="12" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="19" font-weight="600" fill="#111827">The model proposes; deterministic layers and the clinician dispose</text>

  <!-- trust boundary -->
  <rect x="200" y="56" width="740" height="404" rx="12" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="926" y="74" text-anchor="end" font-size="12" fill="#2563eb">trusted, deterministic</text>

  <g font-size="13" fill="#111827">
    <!-- inputs column -->
    <rect x="20" y="86" width="160" height="44" rx="8" fill="#f3f4f6" stroke="#9ca3af"/><text x="100" y="113" text-anchor="middle">Sensor signals</text>
    <rect x="20" y="196" width="160" height="44" rx="8" fill="#fef2f2" stroke="#f87171"/><text x="100" y="216" text-anchor="middle">Free text</text><text x="100" y="232" text-anchor="middle" font-size="11" fill="#991b1b">notes, messages (untrusted)</text>
    <rect x="20" y="300" width="160" height="56" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="100" y="324" text-anchor="middle" font-weight="600">Proposer LLM</text><text x="100" y="342" text-anchor="middle" font-size="11" fill="#92400e">untrusted</text>

    <!-- deterministic -->
    <rect x="224" y="86" width="190" height="44" rx="8" fill="#eff6ff" stroke="#60a5fa"/><text x="319" y="106" text-anchor="middle">Quality flags +</text><text x="319" y="122" text-anchor="middle">deterministic features</text>
    <rect x="450" y="86" width="190" height="44" rx="8" fill="#eff6ff" stroke="#60a5fa"/><text x="545" y="106" text-anchor="middle">Step-down ladder</text><text x="545" y="122" text-anchor="middle" font-size="11">mode + autonomy-tier cap</text>
    <rect x="224" y="196" width="190" height="44" rx="8" fill="#fff7ed" stroke="#fb923c"/><text x="319" y="216" text-anchor="middle">Quarantined parser</text><text x="319" y="232" text-anchor="middle" font-size="11">no tools; 3 typed fields</text>
    <rect x="224" y="150" width="190" height="30" rx="8" fill="#eff6ff" stroke="#60a5fa"/><text x="319" y="170" text-anchor="middle" font-size="12">Session plan committed first</text>

    <rect x="224" y="306" width="190" height="44" rx="8" fill="#eff6ff" stroke="#60a5fa"/><text x="319" y="326" text-anchor="middle">Typed action</text><text x="319" y="342" text-anchor="middle" font-size="11">closed set, coded reasons</text>
    <rect x="450" y="300" width="190" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="545" y="322" text-anchor="middle" font-weight="600">Fail-closed gate</text><text x="545" y="340" text-anchor="middle" font-size="11">ALLOW / DENY / ESCALATE</text>
    <rect x="676" y="300" width="160" height="56" rx="8" fill="#eff6ff" stroke="#60a5fa"/><text x="756" y="322" text-anchor="middle">Independent monitor</text><text x="756" y="340" text-anchor="middle" font-size="11">defer / trusted edit</text>

    <rect x="676" y="196" width="244" height="44" rx="8" fill="#f5f3ff" stroke="#8b5cf6"/><text x="798" y="216" text-anchor="middle">Signed, expiring envelope</text><text x="798" y="232" text-anchor="middle" font-size="11">set by the clinician; narrowing-only edits</text>
    <rect x="676" y="86" width="244" height="44" rx="8" fill="#f5f3ff" stroke="#8b5cf6"/><text x="798" y="106" text-anchor="middle">Clinician view (suggest tier)</text><text x="798" y="122" text-anchor="middle" font-size="11">what was seen is logged</text>

    <rect x="676" y="390" width="244" height="50" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="798" y="411" text-anchor="middle">Actuation port</text><text x="798" y="428" text-anchor="middle" font-size="11">accepts only gate-approved commands</text>
    <rect x="676" y="482" width="244" height="50" rx="8" fill="#fde68a" stroke="#d97706"/><text x="798" y="503" text-anchor="middle" font-weight="600">Firmware ceilings + human stop</text><text x="798" y="520" text-anchor="middle" font-size="11">outside all software</text>

    <rect x="224" y="400" width="416" height="40" rx="8" fill="#f3f4f6" stroke="#6b7280"/><text x="432" y="425" text-anchor="middle">Hash-chained audit log: every proposal, verdict, envelope, view, action</text>
    <rect x="224" y="482" width="416" height="50" rx="8" fill="#ffffff" stroke="#6b7280" stroke-dasharray="4 3"/><text x="432" y="503" text-anchor="middle">Delegation meter</text><text x="432" y="520" text-anchor="middle" font-size="11">reads the log, reports only, never acts</text>
  </g>

  <g stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="180" y1="108" x2="222" y2="108"/>
    <line x1="414" y1="108" x2="448" y2="108"/>
    <line x1="180" y1="218" x2="222" y2="218"/>
    <line x1="180" y1="328" x2="222" y2="328"/>
    <line x1="414" y1="328" x2="448" y2="328"/>
    <line x1="640" y1="328" x2="674" y2="328"/>
    <path d="M545,130 L545,298"/>
    <path d="M414,218 C440,218 470,260 500,298"/>
    <path d="M756,240 L756,298"/>
    <path d="M836,300 L836,132"/>
    <path d="M756,356 L756,388"/>
    <path d="M798,440 L798,480"/>
    <path d="M432,440 L432,480"/>
  </g>
  <text x="852" y="270" font-size="11" fill="#6b7280">suggestion</text>
  <text x="772" y="378" font-size="11" fill="#6b7280">re-gated</text>
  <text x="560" y="210" font-size="11" fill="#6b7280">tier cap</text>
  <text x="430" y="266" font-size="11" fill="#6b7280">raise-only claims</text>
</svg>
