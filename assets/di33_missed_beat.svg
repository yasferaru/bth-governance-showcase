<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Error in RMSSD from one missed beat</title>
<rect width="720" height="440" rx="12" fill="#ffffff"/>
<text x="360.0" y="32.0" font-size="17" text-anchor="middle" fill="#111827" font-weight="600">One missed beat: error in RMSSD (simulation)</text>
<line x1="80" y1="370.0" x2="520" y2="370.0" stroke="#e5e7eb"/>
<text x="72.0" y="374.0" font-size="11" text-anchor="end" fill="#6b7280" font-weight="normal">0</text>
<line x1="80" y1="318.3333333333333" x2="520" y2="318.3333333333333" stroke="#e5e7eb"/>
<text x="72.0" y="322.3" font-size="11" text-anchor="end" fill="#6b7280" font-weight="normal">50</text>
<line x1="80" y1="266.6666666666667" x2="520" y2="266.6666666666667" stroke="#e5e7eb"/>
<text x="72.0" y="270.7" font-size="11" text-anchor="end" fill="#6b7280" font-weight="normal">100</text>
<line x1="80" y1="215.0" x2="520" y2="215.0" stroke="#e5e7eb"/>
<text x="72.0" y="219.0" font-size="11" text-anchor="end" fill="#6b7280" font-weight="normal">150</text>
<line x1="80" y1="163.33333333333334" x2="520" y2="163.33333333333334" stroke="#e5e7eb"/>
<text x="72.0" y="167.3" font-size="11" text-anchor="end" fill="#6b7280" font-weight="normal">200</text>
<line x1="80" y1="111.66666666666663" x2="520" y2="111.66666666666663" stroke="#e5e7eb"/>
<text x="72.0" y="115.7" font-size="11" text-anchor="end" fill="#6b7280" font-weight="normal">250</text>
<line x1="80" y1="60.0" x2="520" y2="60.0" stroke="#e5e7eb"/>
<text x="72.0" y="64.0" font-size="11" text-anchor="end" fill="#6b7280" font-weight="normal">300</text>
<text x="128.9" y="388.0" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">55</text>
<text x="275.6" y="388.0" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">70</text>
<text x="471.1" y="388.0" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">90</text>
<rect x="80" y="60" width="440" height="310" fill="none" stroke="#9ca3af"/>
<line x1="80" y1="266.6666666666667" x2="520" y2="266.6666666666667" stroke="#111827" stroke-dasharray="4 4"/>
<text x="516.0" y="260.7" font-size="11" text-anchor="end" fill="#111827" font-weight="normal">100 ms</text>
<text x="300.0" y="410.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal">Heart rate (beats per minute)</text>
<text x="24" y="215.0" font-size="12" text-anchor="middle" transform="rotate(-90 24 215.0)" fill="#111827">Median RMSSD error (ms)</text>
<polyline points="128.9,82.7 275.6,184.0 471.1,270.6" fill="none" stroke="#dc2626" stroke-width="2"/>
<circle cx="128.9" cy="82.7" r="3.5" fill="#dc2626"/>
<circle cx="275.6" cy="184.0" r="3.5" fill="#dc2626"/>
<circle cx="471.1" cy="270.6" r="3.5" fill="#dc2626"/>
<line x1="540" y1="70" x2="564" y2="70" stroke="#dc2626" stroke-width="2"/>
<text x="570.0" y="74.0" font-size="12" text-anchor="start" fill="#111827" font-weight="normal">30 s window</text>
<polyline points="128.9,185.0 275.6,253.2 471.1,309.6" fill="none" stroke="#2563eb" stroke-width="2"/>
<circle cx="128.9" cy="185.0" r="3.5" fill="#2563eb"/>
<circle cx="275.6" cy="253.2" r="3.5" fill="#2563eb"/>
<circle cx="471.1" cy="309.6" r="3.5" fill="#2563eb"/>
<line x1="540" y1="92" x2="564" y2="92" stroke="#2563eb" stroke-width="2"/>
<text x="570.0" y="96.0" font-size="12" text-anchor="start" fill="#111827" font-weight="normal">60 s window</text>
<polyline points="128.9,251.2 275.6,297.6 471.1,335.1" fill="none" stroke="#16a34a" stroke-width="2"/>
<circle cx="128.9" cy="251.2" r="3.5" fill="#16a34a"/>
<circle cx="275.6" cy="297.6" r="3.5" fill="#16a34a"/>
<circle cx="471.1" cy="335.1" r="3.5" fill="#16a34a"/>
<line x1="540" y1="114" x2="564" y2="114" stroke="#16a34a" stroke-width="2"/>
<text x="570.0" y="118.0" font-size="12" text-anchor="start" fill="#111827" font-weight="normal">120 s window</text>
<text x="360.0" y="428.0" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal">Simulated heartbeats only, clean RMSSD 50 ms. Pre-registered study DI-33.</text>
</svg>
